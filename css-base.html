<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Основы Css</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        color: #706d6d;
      }
      p {
        width: 150px;
        height: 150px;
        background-color: rgb(35, 80, 177);
        margin: 35px;
        padding: 60px 45px;
      }
      p {
        border-radius: 100%;
      }
      .red {
        background-color: rgb(255, 0, 0);
      }
      .gold {
        background-color: gold;
      }
      .green {
        background-color: lawngreen;
      }
    </style>
  </head>
  <body>
    <p class="red">красный</p>
    <p class="gold">желтый</p>
    <p class="green">зеленый</p>
  </body>
</html>
